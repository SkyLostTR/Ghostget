name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a **security** problem, do not open an issue: see SECURITY.md.
  - type: textarea
    id: command
    attributes:
      label: The command you ran
      description: Add `--verbose` and paste the full output.
      render: shell
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of `ghostget --version` and `ghostget doctor`
      render: shell
    validations:
      required: true
  - type: dropdown
    id: edition
    attributes:
      label: Edition
      options:
        - npm (npx / global)
        - PowerShell script
        - Library
    validations:
      required: true
  - type: input
    id: app
    attributes:
      label: The app, if the problem is with one (Store id)
      placeholder: 9N0DX20HK701
