name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: TEMP diagnose Windows PowerShell module loading
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $PSVersionTable | Out-String | Write-Host
          Write-Host "PSModulePath: $env:PSModulePath"
          Write-Host "PSHOME: $PSHOME"
          Get-Module -ListAvailable Microsoft.PowerShell.Security, Microsoft.PowerShell.Utility | Format-List * | Out-String | Write-Host
          try {
            Import-Module Microsoft.PowerShell.Security -ErrorAction Stop -Verbose
            Write-Host "IMPORT OK"
          } catch {
            Write-Host "IMPORT FAILED"
            $_ | Format-List * -Force | Out-String | Write-Host
            $_.Exception | Format-List * -Force | Out-String | Write-Host
            $ie = $_.Exception.InnerException
            $n = 0
            while ($ie -and $n -lt 5) {
              Write-Host "--- inner exception $n ---"
              $ie | Format-List * -Force | Out-String | Write-Host
              $ie = $ie.InnerException
              $n++
            }
          }
      - run: npm test

  package:
    name: Packaged CLI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: Pack and check the contents
        shell: bash
        run: |
          npm pack
          tar -tzf ghostget-*.tgz > contents.txt
          grep -q '^package/types/index.d.ts$' contents.txt   # type declarations were generated by prepack
          grep -q '^package/scripts/ghostget.ps1$' contents.txt
          ! grep -q '^package/test/' contents.txt              # tests and fixtures are not published

      - name: Install the tarball into a fresh project and run it through npx
        shell: bash
        run: |
          mkdir "$RUNNER_TEMP/proj"
          npm pack --pack-destination "$RUNNER_TEMP/proj"
          cd "$RUNNER_TEMP/proj"
          npm init -y > /dev/null
          npm install ./ghostget-*.tgz --no-audit --no-fund
          npx --no-install ghostget --version
          npx --no-install ghostget url 9N0DX20HK701

      - name: Global install
        shell: bash
        run: |
          npm install -g ./ghostget-*.tgz
          ghostget --version
          ghostget url 9N0DX20HK701
